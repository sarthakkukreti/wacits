# Local-debugging override — layer this on top of docker-compose.yml when
# you want to run the FULL containerized stack on a dev machine and hit
# each service directly by port, without going through Caddy:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Not needed for day-to-day local development — the RUNBOOK's normal flow
# (running each app directly with `bun run dev:*` against a local Postgres/
# Redis) is faster to iterate on and is what this project has actually been
# verified against. Use this file only when you specifically want to
# exercise the Docker images themselves. Never use this file on the
# production server — it republishes Postgres and Valkey to the host.
#
# The base docker-compose.yml declares the `coolify` network as `external:
# true` (it must already exist on the VPS, created by Coolify itself) — a
# dev machine won't have that network, so this override flips it back to a
# plain Compose-managed network for local runs. The `caddy` service's own
# `networks: [default, coolify]` list still applies unchanged (Compose
# merges service network lists across files); only which network named
# `coolify` gets attached changes.
networks:
  coolify:
    external: false
services:
  postgres:
    ports:
      - "5432:5432"
  valkey:
    ports:
      - "6379:6379"
  api:
    ports:
      - "8787:8787"
  webhook:
    ports:
      - "8788:8788"
  click-redirect:
    ports:
      - "8789:8789"
