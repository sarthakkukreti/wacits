# PRD §4.1 — every process runs as a separately restartable container.
# TS-1: every image tag is pinned exactly; `latest` must never appear here.
#
# NOTE: postgres/valkey/caddy patch tags below were chosen at scaffold time
# and have not been re-verified against the current release feed — confirm
# the latest patch before a real deployment (same discipline as the
# [Verify before build] markers in docs/PRD.md).
#
# Split hosting (see RUNBOOK.md "Split hosting"): the Next.js web app is
# NOT part of this stack — it's built standalone and deployed separately to
# Hostinger shared hosting. This compose file runs everything else
# (database, queue, API, webhook receiver, workers) on the VPS, which is
# managed by Coolify. Coolify owns its own Traefik proxy on 80/443 for
# every app on the box, so NOTHING here publishes a host port — Postgres,
# Valkey, the API, the webhook receiver and click-redirect are reachable
# only on the internal Docker network or through the internal `caddy`
# router, which Coolify's Traefik is pointed at via the Traefik labels on
# the `caddy` service below (not a Coolify UI domain assignment — see the
# note above and RUNBOOK.md for why). docker-compose.dev.yml republishes
# ports directly for local debugging outside of Coolify.
#
# Because the web app now runs on a different host entirely, the API is no
# longer purely internal — it's reachable at
# https://api.wacits.cyberlative.com/ through Caddy, with CORS locked to
# the frontend's origin (see CORS_ORIGIN in .env and apps/api/src/index.ts).
#
# Postgres credentials come from .env (never hardcode them here — this file
# is committed to git). Copy .env.example and set real values before
# running this in anything but a throwaway environment.
#
# Traefik routing (`caddy` service labels below): Coolify's per-service
# "Domain" UI field was tried first and rejected — for this Docker Compose
# resource type/Coolify version, assigning a domain there makes Coolify
# auto-inject `ports: 80:80 / 443:443` onto the service, which collides with
# Coolify's own Traefik already bound to those host ports (confirmed via
# `docker inspect` and the materialized compose file in
# /data/coolify/applications/<uuid>/docker-compose.yaml on the VPS). The fix,
# reverse-engineered from another working Cyberlative project on the same
# VPS (irfcrmsi) via `docker inspect <container> --format '{{json
# .Config.Labels}}'`, is to skip Coolify's domain field entirely and instead
# hand-write the Traefik labels + join the shared external `coolify` network
# directly — Traefik then discovers and routes to the container over that
# network with no host port publishing at all. Leave "Domains for caddy"
# EMPTY in Coolify's UI when using this.

services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wacits}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wacits}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wacits}"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8.0.2
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wacits}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wacits}
      REDIS_URL: redis://valkey:6379
    # Alias below is what the caddy service actually dials (see Caddyfile).
    # Necessary because caddy also joins Coolify's shared `coolify` network
    # (see caddy service, further down) to be reachable by Traefik — and on
    # that network, a bare "api" is NOT unique: other apps deployed via this
    # same Coolify instance can (and do — see irfcrmsi) name their own
    # service "api" too, so Docker's embedded DNS can resolve the plain name
    # ambiguously/inconsistently to the wrong container across requests
    # (confirmed live: caddy's own logs showed "connection refused" dialing
    # two different IPs for hostname "api" on different requests). A
    # project-scoped alias sidesteps the collision entirely.
    networks:
      default:
        aliases:
          - wacits-api
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  webhook:
    build:
      context: .
      dockerfile: apps/webhook/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wacits}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wacits}
    # See the `api` service above for why this alias exists.
    networks:
      default:
        aliases:
          - wacits-webhook
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  click-redirect:
    build:
      context: .
      dockerfile: apps/click-redirect/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wacits}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wacits}
    # See the `api` service above for why this alias exists.
    networks:
      default:
        aliases:
          - wacits-click-redirect
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8789/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  worker-send:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    command: ["bun", "run", "start:send"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wacits}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wacits}
      REDIS_URL: redis://valkey:6379
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  worker-import:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    command: ["bun", "run", "start:import"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wacits}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wacits}
      REDIS_URL: redis://valkey:6379
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  worker-scheduler:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    command: ["bun", "run", "start:scheduler"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wacits}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wacits}
      REDIS_URL: redis://valkey:6379
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Internal path-based router only — see ./Caddyfile for the routing rules
  # (api / /webhook / /c/*). Deliberately does NOT publish 80/443 or manage
  # its own TLS: the VPS runs Coolify, which already owns a Traefik proxy on
  # those ports for every app on the box. Running our own Caddy on 80/443
  # too would simply fail to bind. Instead this service joins Coolify's own
  # `coolify` Docker network and carries hand-written Traefik labels (see
  # the note above services:) so Traefik discovers it directly and forwards
  # HTTP for api.wacits.cyberlative.com here, terminating TLS at its own
  # edge. Router/service names are prefixed `wacits-` to stay unique across
  # every other app Traefik already routes on this box.
  caddy:
    image: caddy:2.8.4-alpine
    env_file: .env
    networks:
      - default
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.routers.wacits-http.rule=Host(`api.wacits.cyberlative.com`)
      - traefik.http.routers.wacits-http.entrypoints=http
      - traefik.http.routers.wacits-http.middlewares=redirect-to-https@file
      - traefik.http.routers.wacits-https.rule=Host(`api.wacits.cyberlative.com`)
      - traefik.http.routers.wacits-https.entrypoints=https
      - traefik.http.routers.wacits-https.tls=true
      - traefik.http.routers.wacits-https.tls.certresolver=letsencrypt
      - traefik.http.services.wacits.loadbalancer.server.port=80
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_config:/config
    depends_on:
      - api
      - webhook
      - click-redirect

volumes:
  postgres_data:
  valkey_data:
  caddy_config:

networks:
  default:
  coolify:
    external: true
